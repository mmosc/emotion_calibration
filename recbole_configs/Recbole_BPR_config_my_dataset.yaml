model: BPR
dataset: my_dataset
data_path: calibration/data

field_separator: "\t"
seed: 920
reproducibility: True

USER_ID_FIELD: user
ITEM_ID_FIELD: item
LABEL_FIELD: label

load_col:
  inter: [user, item, label]

user_inter_num: 0
item_inter_num: 0

# model config
embedding_size: 256

# Training and evaluation config
epochs: 3
train_batch_size: 4096
eval_batch_size: 4096
learning_rate: 0.0001

train_neg_sample_args:
  distribution: uniform
  sample_num: 1
  alpha: 1.0
  dynamic: False
  candidate_num: 0

eval_args:
  group_by: user
  order: RO
  split: {'RS': [0.8, 0.1, 0.1]}
  mode: full

metrics: ['Recall', 'MRR', 'NDCG', 'Hit', 'Precision']
topk: [10]
valid_metric: NDCG@10
metric_decimal_place: 6
